<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="440" viewBox="0 0 1440 440" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">MRP Insight Console</title>
  <desc id="desc">Material requirements planning: detect inventory risks, explain anomalies, and plan replenishment. Decorative inventory curve with a highlighted risk interval.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1440" y2="440" gradientUnits="userSpaceOnUse"><stop stop-color="#101C35"/><stop offset="1" stop-color="#142E43"/></linearGradient>
    <linearGradient id="area" x1="0" y1="120" x2="0" y2="360" gradientUnits="userSpaceOnUse"><stop stop-color="#47DCC3" stop-opacity=".26"/><stop offset="1" stop-color="#47DCC3" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" stroke="#A1C2D4" stroke-opacity=".065"/></pattern>
  </defs>
  <rect width="1440" height="440" rx="24" fill="url(#bg)"/>
  <rect width="1440" height="440" rx="24" fill="url(#grid)"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <rect x="60" y="50" width="48" height="48" rx="13" fill="#39D8BC"/>
    <g stroke="#112A36" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m72 66 12-6 12 6-12 6-12-6Zm0 0v16l12 6 12-6V66M84 72v16"/></g>
    <text x="124" y="80" fill="#B7CCDD" font-size="15" font-weight="600" letter-spacing="3">MATERIAL REQUIREMENTS PLANNING</text>
    <text x="60" y="174" fill="#F5F9FF" font-size="60" font-weight="700" letter-spacing="-2">MRP Insight Console</text>
    <text x="63" y="217" fill="#A9C1D5" font-size="22">From inventory signals to informed decisions.</text>
    <g font-size="17" font-weight="600">
      <rect x="60" y="267" width="144" height="43" rx="21.5" fill="#1C3A4A"/><circle cx="83" cy="288" r="5" fill="#44DDC0"/><text x="98" y="294" fill="#DBFBF3">Detect risks</text>
      <rect x="216" y="267" width="194" height="43" rx="21.5" fill="#24344F"/><circle cx="239" cy="288" r="5" fill="#8BAEFF"/><text x="254" y="294" fill="#E0EAFF">Explain anomalies</text>
      <rect x="422" y="267" width="141" height="43" rx="21.5" fill="#373B40"/><circle cx="445" cy="288" r="5" fill="#F0C47A"/><text x="460" y="294" fill="#FFF0D4">Plan ahead</text>
    </g>
    <text x="63" y="383" fill="#779BB5" font-size="14" letter-spacing="1.3">RULE-BASED ANALYSIS  /  WEEKLY FORECASTING  /  OPTIONAL LLM</text>
    <rect x="844" y="56" width="540" height="328" rx="20" fill="#0E2034" stroke="#34536B"/>
    <circle cx="869" cy="80" r="4" fill="#4B6A82"/><circle cx="884" cy="80" r="4" fill="#4B6A82"/><circle cx="899" cy="80" r="4" fill="#4B6A82"/>
    <text x="868" y="119" fill="#CADDEA" font-size="15" font-weight="600">INVENTORY OUTLOOK</text>
    <text x="1338" y="119" fill="#7699B3" font-size="12" text-anchor="end">ILLUSTRATION</text>
    <g stroke="#284259" stroke-width="1"><path d="M874 167H1354M874 218H1354M874 269H1354M874 320H1354"/></g>
    <rect x="1063" y="149" width="96" height="178" rx="8" fill="#F1B66B" fill-opacity=".1"/>
    <path d="m874 190 44-29 41 31 48 15 45 31 44 49 42-10 45-78 46-16 43 25 42-52 50 23V327H874Z" fill="url(#area)"/>
    <path d="M874 252H1354" stroke="#8BAEFF" stroke-width="2" stroke-dasharray="6 6"/>
    <path d="m874 190 44-29 41 31 48 15 45 31 44 49 42-10 45-78 46-16 43 25 42-52 50 23" stroke="#49DCC4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1096" cy="287" r="6" fill="#EABB7C" stroke="#132A3F" stroke-width="3"/>
    <circle cx="876" cy="351" r="4" fill="#49DCC4"/><text x="888" y="356" fill="#A8C1D3" font-size="12">Inventory</text>
    <path d="M1000 351h18" stroke="#8BAEFF" stroke-width="2" stroke-dasharray="4 3"/><text x="1026" y="356" fill="#A8C1D3" font-size="12">Safety stock</text>
    <rect x="1160" y="347" width="9" height="9" rx="2" fill="#EABB7C"/><text x="1178" y="356" fill="#A8C1D3" font-size="12">Risk interval</text>
  </g>
</svg>
